<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">

<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Pendaftaran Seminar Teknologi</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
</head>

<body>

    <div class="container">

        <div class="header">
            <p class="subjudul">KEGIATAN AKADEMIK</p>
            <h1>Formulir Pendaftaran Seminar</h1>
            <p>Lengkapi informasi berikut untuk mengikuti seminar teknologi.</p>
        </div>

        <form action="#" method="post" enctype="multipart/form-data">

            <table cellspacing="4" cellpadding="4" border="1">

                <tr class="judul-tabel">
                    <th colspan="2">Informasi Peserta</th>
                </tr>

                <tr>
                    <td class="label">
                        <label for="nama">Nama Peserta</label>
                    </td>
                    <td>
                        <input type="text" id="nama" name="nama" size="30" />
                    </td>
                </tr>

                <tr>
                    <td class="label">
                        <label for="email">Email</label>
                    </td>
                    <td>
                        <input type="text" id="email" name="email" size="30" />
                    </td>
                </tr>

                <tr>
                    <td class="label">
                        <label for="nim">NIM</label>
                    </td>
                    <td>
                        <input type="text" id="nim" name="nim" size="30" />
                    </td>
                </tr>

                <tr>
                    <td class="label">
                        <label for="prodi">Program Studi</label>
                    </td>
                    <td>
                        <select id="prodi" name="prodi">
                            <option>Informatika</option>
                            <option>Sistem Informasi</option>
                            <option>Teknik Industri</option>
                            <option>Manajemen</option>
                            <option>Akuntansi</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td class="label">
                        <strong>Jenis Tiket</strong>
                    </td>
                    <td>
                        <p>
                            <input type="radio" id="reguler" name="tiket" value="Reguler" />
                            <label for="reguler">Reguler</label>
                        </p>

                        <p>
                            <input type="radio" id="vip" name="tiket" value="VIP" />
                            <label for="vip">VIP</label>
                        </p>

                        <p>
                            <input type="radio" id="online" name="tiket" value="Online" />
                            <label for="online">Online</label>
                        </p>
                    </td>
                </tr>

                <tr>
                    <td class="label atas">
                        <strong>Topik Seminar</strong>
                    </td>
                    <td>
                        <p>
                            <input type="checkbox" id="ai" name="topik" value="Artificial Intelligence" />
                            <label for="ai">Artificial Intelligence</label>
                        </p>

                        <p>
                            <input type="checkbox" id="data" name="topik" value="Data Science" />
                            <label for="data">Data Science</label>
                        </p>

                        <p>
                            <input type="checkbox" id="cyber" name="topik" value="Cyber Security" />
                            <label for="cyber">Cyber Security</label>
                        </p>

                        <p>
                            <input type="checkbox" id="cloud" name="topik" value="Cloud Computing" />
                            <label for="cloud">Cloud Computing</label>
                        </p>

                        <p>
                            <input type="checkbox" id="web" name="topik" value="Web Development" />
                            <label for="web">Web Development</label>
                        </p>
                    </td>
                </tr>

                <tr>
                    <td class="label">
                        <label for="jam">Pilihan Jam</label>
                    </td>
                    <td>
                        <select id="jam" name="jam">
                            <option>08.00 - 10.00</option>
                            <option>10.00 - 12.00</option>
                            <option>13.00 - 15.00</option>
                            <option>15.00 - 17.00</option>
                            <option>19.00 - 21.00</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td class="label">
                        <strong>Cara Pembayaran</strong>
                    </td>
                    <td>
                        <p>
                            <input type="radio" id="qris" name="pembayaran" value="QRIS" />
                            <label for="qris">QRIS</label>
                        </p>

                        <p>
                            <input type="radio" id="transfer" name="pembayaran" value="Transfer Bank" />
                            <label for="transfer">Transfer Bank</label>
                        </p>
                    </td>
                </tr>

                <tr>
                    <td class="label atas">
                        <label for="pertanyaan">Pertanyaan untuk Narasumber</label>
                    </td>
                    <td>
                        <textarea id="pertanyaan" name="pertanyaan" rows="6" cols="30"></textarea>
                    </td>
                </tr>

                <tr>
                    <td class="label">
                        <label for="bukti">Bukti Pembayaran</label>
                    </td>
                    <td>
                        <input type="file" id="bukti" name="bukti"
                        accept="image/gif, image/jpeg, image/png" />
                    </td>
                </tr>

                <tr>
                    <td colspan="2" class="tombol">
                        <input type="submit" name="simpan" value="Daftar Seminar" />
                    </td>
                </tr>

            </table>

        </form>

        <p class="catatan">
            Pastikan seluruh informasi yang diisi sudah benar sebelum mengirim formulir.
        </p>

    </div>

</body>
</html>
