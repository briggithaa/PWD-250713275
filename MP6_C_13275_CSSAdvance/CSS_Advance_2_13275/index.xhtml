<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">

<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Formulir Pendaftaran Lomba</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
</head>

<body>

    <div class="container">

        <div class="header">
            <p class="subjudul">KOMPETISI MAHASISWA</p>
            <h1>Formulir Pendaftaran Lomba</h1>
            <p>Daftarkan tim dan karya terbaikmu untuk mengikuti kompetisi.</p>
        </div>

        <form action="#" method="post">

            <h2>Data Tim</h2>

            <table cellspacing="4" cellpadding="4" border="1">

                <tr>
                    <td class="label">
                        <label for="namaTim">Nama Tim</label>
                    </td>
                    <td>
                        <input type="text" id="namaTim" name="namaTim" size="30" />
                    </td>
                </tr>

                <tr>
                    <td class="label">
                        <label for="namaKetua">Nama Ketua</label>
                    </td>
                    <td>
                        <input type="text" id="namaKetua" name="namaKetua" size="30" />
                    </td>
                </tr>

                <tr>
                    <td class="label">
                        <label for="jumlahAnggota">Jumlah Anggota</label>
                    </td>
                    <td>
                        <input type="text" id="jumlahAnggota" name="jumlahAnggota" size="10" />
                    </td>
                </tr>

                <tr>
                    <td class="label">
                        <label for="prodi">Program Studi</label>
                    </td>
                    <td>
                        <select id="prodi" name="prodi">
                            <option>Informatika</option>
                            <option>Sistem Informasi</option>
                            <option>Teknik Industri</option>
                        </select>
                    </td>
                </tr>

            </table>

            <h2>Pilihan Lomba</h2>

            <table cellspacing="4" cellpadding="4" border="1">

                <tr>
                    <td class="label">
                        <strong>Kategori Lomba</strong>
                    </td>
                    <td>
                        <p>
                            <input type="radio" id="individu" name="kategori" value="Individu" />
                            <label for="individu">Individu</label>
                        </p>

                        <p>
                            <input type="radio" id="kelompok" name="kategori" value="Kelompok" />
                            <label for="kelompok">Kelompok</label>
                        </p>
                    </td>
                </tr>

                <tr>
                    <td class="label">
                        <strong>Bidang Lomba</strong>
                    </td>
                    <td>
                        <p>
                            <input type="checkbox" id="programming" name="bidang" value="Programming" />
                            <label for="programming">Programming</label>
                        </p>

                        <p>
                            <input type="checkbox" id="uiux" name="bidang" value="UI/UX Design" />
                            <label for="uiux">UI/UX Design</label>
                        </p>

                        <p>
                            <input type="checkbox" id="karyaTulis" name="bidang" value="Karya Tulis" />
                            <label for="karyaTulis">Karya Tulis</label>
                        </p>
                    </td>
                </tr>

            </table>

            <h2>Informasi Karya</h2>

            <table cellspacing="4" cellpadding="4" border="1">

                <tr>
                    <td class="label atas">
                        <label for="deskripsi">Deskripsi Karya</label>
                    </td>
                    <td>
                        <textarea id="deskripsi" name="deskripsi" rows="6" cols="30"></textarea>
                    </td>
                </tr>

                <tr>
                    <td class="label">
                        <label for="fileKarya">File Karya</label>
                    </td>
                    <td>
                        <input type="file" id="fileKarya" name="fileKarya" />
                    </td>
                </tr>

                <tr>
                    <td colspan="2" class="tombol">
                        <input type="submit" name="daftar" value="Daftar Lomba" />
                    </td>
                </tr>

            </table>

        </form>

        <p class="catatan">
            Periksa kembali data tim dan informasi karya sebelum melakukan pendaftaran.
        </p>

    </div>

</body>
</html>
